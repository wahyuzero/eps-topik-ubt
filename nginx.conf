server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Standard Security Headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Block access to hidden files and directories
    location ~ /\. {
        deny all;
        return 404;
    }

    # Block access to sensitive and plain text files
    location ~* \.(env|log|sh|git.*|sql|bak|backup)$ {
        return 404;
    }

    # Enable gzip compression
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Media, Audio & PDF static streaming cache with HTTP 206 Byte-Range support
    location ~* \.(jpg|jpeg|png|webp|gif|ico|svg|css|js|mp3|pdf|json|woff2?|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public, no-transform";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Access-Control-Allow-Origin "*";
    }

    # SPA Fallback for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
